    <div id="contact">
        <table>
            <tr>
                <td>
                    <label for="name">Name:</label>
                </td>
                <td>
                    <input name="name" type="text" id="name" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="contact">Phone Number:</label>
                </td>
                <td>
                    <input name="contact" type="text" id="contact" />
                </td>
            </tr>
            <tr>
                <td>                    
                    <label for="email">Email:</label>
                </td>
                <td>
                    <input name="email" type="email" id="email" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="address">Address:</label>
                </td>
                <td>
                    <input name="address" type="text" id="address" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="preferred">Preferred Contact Method:</label>
                </td>
                <td>
                    <label for="radioEmail">Email</label>
                    <input checked="checked" id="radioEmail" name="preferred" type="radio" value="email" />
                </td>
            </tr>
            <tr>
                <td>

                </td>
                <td>
                    <label for="radioPhone">Phone</label>
                    <input id="radioPhone" name="preferred" type="radio" value="phone" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="dropdown">Issue:</label>
                </td>
                <td>
                    <select id="dropdown">
                        <option disabled selected="selected">Please Select</option>
                        <option value="1"> My Computer Crashed </option>
                        <option value="2"> My Computer Is On Fire</option>
                        <option value="3"> My Computer Is Trying To Kill Me</option>
                        <option value="4"> My Computer Is Not Working As Intended</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="other">Other (Please Specify):</label>
                </td>
                <td>
                    <input name="other" type="text" id="other" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="checkbox">Sign Up?</label>
                </td>
                <td>
                    <input id="checkbox" name="signup" type="checkbox" value="1" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="password">Password:</label>
                </td>
                <td>
                    <input name="password" type="password" id="password" />
                </td>
            </tr>          
        </table>
        <button type="submit" class="button1" value="Submit">Submit</button>
    </div>
